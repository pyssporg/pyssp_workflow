[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pyssp-workflow"
version = "0.1.0"
description = "Composable build, run, compare, and verify workflows for SSP models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pyssporg contributors" }]
keywords = ["ssp", "fmi", "simulation", "workflow", "verification"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# Measurement, judgment, and evidence come from pyssp_vv. During development it
# is installed from the sibling checkout (see requirements-dev.txt); it is not
# yet on PyPI, so it is not declared here and `pip install -e .` stays offline.
dependencies = []

[project.optional-dependencies]
flow = ["sequence-extensions-flow>=3"]
# Placeholders until the pyssp submodules are linked under 3rd_party/.
build = []
simulate = []
all = ["sequence-extensions-flow>=3"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyssp_workflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
