[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pyssp-workflow"
version = "0.1.0"
description = "Composable build, run, compare, and verify workflows for SSP models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pyssporg contributors" }]
keywords = ["ssp", "fmi", "simulation", "workflow", "verification"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# This package composes capabilities; it does not implement them. The three
# distributions below are imported unconditionally (binding, compare, authoring),
# so they are hard dependencies of the wheel.
#
# Siblings are pinned to immutable release assets attached by that package's
# `wheels.yml` workflow: the tag is `v<version>` and the asset is named
# `<dist>-<version>-py3-none-any.whl`. A version whose tag has not been released
# yet makes the wheel uninstallable, so release siblings before this package.
dependencies = [
  "experimental-pyssp-standard @ https://github.com/pyssporg/experimental_pyssp_standard/releases/download/v0.9.2.dev0/experimental_pyssp_standard-0.9.2.dev0-py3-none-any.whl",
  "pyssp-simulate @ https://github.com/pyssporg/pyssp_simulate/releases/download/v0.2.0/pyssp_simulate-0.2.0-py3-none-any.whl",
  "pyssp-vv[measure] @ https://github.com/pyssporg/pyssp_vv/releases/download/v0.1.0/pyssp_vv-0.1.0-py3-none-any.whl",
]

[project.optional-dependencies]
# Node layer: imported by pyssp_workflow.nodes only (Python 3.11+).
flow = ["sequence-extensions-flow @ https://github.com/jkCXf9X4/sequence_extensions/releases/download/v3.0.0/sequence_extensions_flow-3.0.0-py3-none-any.whl"]
# Build CLI: `pyssp` is invoked as a subprocess, never imported.
build = ["pyssp-sysml2 @ https://github.com/pyssporg/pyssp_sysml2/releases/download/v0.3.0/pyssp_sysml2-0.3.0-py3-none-any.whl"]
all = [
  "sequence-extensions-flow @ https://github.com/jkCXf9X4/sequence_extensions/releases/download/v3.0.0/sequence_extensions_flow-3.0.0-py3-none-any.whl",
  "pyssp-sysml2 @ https://github.com/pyssporg/pyssp_sysml2/releases/download/v0.3.0/pyssp_sysml2-0.3.0-py3-none-any.whl",
]
# Base dependencies cover the siblings the test suite imports; dev adds the runner.
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.metadata]
# Sibling dependencies are PEP 508 direct references to release assets.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pyssp_workflow"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
xfail_strict = true
addopts = "-q"
markers = [
  "level_static: static inspection of sources and imports",
  "level_unit: one function or object in isolation",
  "level_component: one workflow component against its file artifacts",
  "level_contract: the argv/file contract at a component border",
  "level_integration: several real components composed together",
  "level_system: the package as a whole end to end",
  "level_acceptance: the accepted product behaviour",
  "slow: tests that dominate the suite runtime",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# The capability checkouts keep their own style and their own CI.
extend-exclude = ["3rd_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
