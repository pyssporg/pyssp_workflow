[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pyssp-workflow"
version = "0.3.0"
description = "Composable build, run, compare, and verify workflows for SSP models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pyssporg contributors" }]
keywords = ["ssp", "fmi", "simulation", "workflow", "verification"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# This package composes capabilities; it does not implement them. The six
# distributions below are required: three are imported unconditionally
# (binding, compare, authoring), and three cover the node layer and the SysML
# install bundle. They are plain dependencies rather than extras so consumers
# install one package.
#
# Siblings are pinned to immutable release assets attached by that package's
# `wheels.yml` workflow: the tag is `v<version>` and the asset is named
# `<dist>-<version>-py3-none-any.whl`. A version whose tag has not been released
# yet makes the wheel uninstallable, so release siblings before this package.
#
# pycps-sysml2 is deliberately absent: pyssp_sysml2 and pyfmi_sysml2 both
# declare it as a dependency, so it arrives transitively and has exactly one
# owner per pin.
dependencies = [
  "experimental-pyssp-standard @ https://github.com/pyssporg/experimental_pyssp_standard/releases/download/v0.9.3.dev0/experimental_pyssp_standard-0.9.3.dev0-py3-none-any.whl",
  "pyssp-simulate @ https://github.com/pyssporg/pyssp_simulate/releases/download/v0.3.0/pyssp_simulate-0.3.0-py3-none-any.whl",
  "pyssp-vv @ https://github.com/pyssporg/pyssp_vv/releases/download/v0.2.0/pyssp_vv-0.2.0-py3-none-any.whl",
  "sequence-extensions-flow @ https://github.com/jkCXf9X4/sequence_extensions/releases/download/v3.0.0/sequence_extensions_flow-3.0.0-py3-none-any.whl",
  "pyssp-sysml2 @ https://github.com/pyssporg/pyssp_sysml2/releases/download/v0.5.0/pyssp_sysml2-0.5.0-py3-none-any.whl",
  "pyfmi-sysml2 @ https://github.com/pyssporg/pyfmi_sysml2/releases/download/v0.2.0/pyfmi_sysml2-0.2.0-py3-none-any.whl",
]

[project.optional-dependencies]
# Base dependencies cover every sibling the package uses; dev adds the runner.
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.metadata]
# Sibling dependencies are PEP 508 direct references to release assets.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pyssp_workflow"]

[tool.hatch.build.targets.sdist]
# Capabilities are installed from release assets and are never vendored into
# this distribution.
exclude = ["/dist"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
xfail_strict = true
addopts = "-q"
markers = [
  "level_static: static inspection of sources and imports",
  "level_unit: one function or object in isolation",
  "level_component: one workflow component against its file artifacts",
  "level_contract: the argv/file contract at a component border",
  "level_integration: several real components composed together",
  "level_system: the package as a whole end to end",
  "level_acceptance: the accepted product behaviour",
  "slow: tests that dominate the suite runtime",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# The capability checkouts keep their own style and their own CI.
extend-exclude = ["3rd_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
