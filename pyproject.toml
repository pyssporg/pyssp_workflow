[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pyssp-workflow"
version = "0.1.0"
description = "Composable build, run, compare, and verify workflows for SSP models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pyssporg contributors" }]
keywords = ["ssp", "fmi", "simulation", "workflow", "verification"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# Measurement, judgment, and evidence come from pyssp_vv. Capabilities are
# linked under 3rd_party/ and installed from requirements-dev.txt during
# development, so `pip install -e .` stays offline. These names are reserved
# for the first PyPI release; see AD-003.
dependencies = []

[project.optional-dependencies]
flow = ["sequence-extensions-flow>=3"]
build = []
simulate = []
all = ["sequence-extensions-flow>=3"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyssp_workflow"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
xfail_strict = true
addopts = "-q"
markers = [
  "level_static: static inspection of sources and imports",
  "level_unit: one function or object in isolation",
  "level_component: one workflow component against its file artifacts",
  "level_contract: the argv/file contract at a component border",
  "level_integration: several real components composed together",
  "level_system: the package as a whole end to end",
  "level_acceptance: the accepted product behaviour",
  "slow: tests that dominate the suite runtime",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# The capability checkouts keep their own style and their own CI.
extend-exclude = ["3rd_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
