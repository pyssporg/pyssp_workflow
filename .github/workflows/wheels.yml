name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wheel is pure Python (py3-none-any), so one interpreter is enough.
      # 3.11 is the floor of the `flow` extra, the highest claim tested here.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir dist .

      - name: Check wheel metadata
        run: |
          python - <<'PY'
          import glob, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as archive:
              (metadata,) = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
              text = archive.read(metadata).decode()
          required = (
              "Requires-Dist: experimental-pyssp-standard>=0.9.2.dev0",
              "Requires-Dist: pyssp-simulate>=0.2",
              "Requires-Dist: pyssp-vv[measure]>=0.1",
          )
          missing = [line for line in required if line not in text]
          assert not missing, f"{wheel}: missing {missing}"
          print(wheel, "declares its capability dependencies")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pyssp-workflow-wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Attach wheel to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.whl --clobber
          else
            gh release create "$tag" dist/*.whl --title "$tag" --notes "Wheel artifact for $tag"
          fi
