name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wheel is pure Python (py3-none-any), so one interpreter is enough.
      # 3.11 is the minimum for the sequence-extensions node layer, the highest
      # claim tested here.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel

      - name: Check wheel metadata
        run: |
          python - <<'PY'
          import glob, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as archive:
              (metadata,) = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
              text = archive.read(metadata).decode()
          # Siblings are PEP 508 direct references to their release assets, so a
          # tag that was never released fails the install rather than resolving
          # an older build.
          required = (
              "Requires-Dist: experimental-pyssp-standard @ https://github.com/pyssporg/experimental_pyssp_standard/releases/download/",
              "Requires-Dist: pyssp-simulate @ https://github.com/pyssporg/pyssp_simulate/releases/download/",
              "Requires-Dist: pyssp-vv @ https://github.com/pyssporg/pyssp_vv/releases/download/",
              "Requires-Dist: pyssp-sysml2 @ https://github.com/pyssporg/pyssp_sysml2/releases/download/v0.4.0/",
              "Requires-Dist: pyfmi-sysml2 @ https://github.com/pyssporg/pyfmi_sysml2/releases/download/v0.1.0/",
              "Requires-Dist: sequence-extensions-flow @ https://github.com/jkCXf9X4/sequence_extensions/releases/download/v3.0.0/",
          )
          missing = [line for line in required if line not in text]
          assert not missing, f"{wheel}: missing {missing}"
          print(wheel, "declares its capability dependencies")
          PY

      - name: Check sdist ships package sources only
        run: |
          python - <<'PY'
          import glob, tarfile
          (sdist,) = glob.glob("dist/*.tar.gz")
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
          vendored = [n for n in names if "/3rd_party/" in n]
          assert not vendored, f"{sdist}: vendors {len(vendored)} 3rd_party entries"
          assert any(n.endswith("/pyproject.toml") for n in names), f"{sdist}: missing pyproject.toml"
          print(sdist, "ships sources only")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pyssp-workflow-dist
          path: dist/*
          if-no-files-found: error

      - name: Attach wheel and sdist to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --notes "Wheel and sdist artifacts for $tag"
          fi
