name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip build
          # Pin the OMSimulator sdist whose nightly is still published: newer
          # sdists (post198) fetch a linux-focal URL that 404s on the current
          # runner image. post115 is pyssp_simulate's declared minimum anyway.
          python -m pip install "OMSimulator==3.0.0.post115" -e ".[dev]"

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist

      - name: Check wheel metadata
        run: |
          python - <<'PY'
          import glob, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as archive:
              (metadata,) = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
              text = archive.read(metadata).decode()
          # Siblings are PEP 508 direct references to their release assets, so a
          # tag that was never released fails the install rather than resolving
          # an older build.
          required = (
              "Requires-Dist: experimental-pyssp-standard @ https://github.com/pyssporg/experimental_pyssp_standard/releases/download/",
              "Requires-Dist: pyssp-simulate @ https://github.com/pyssporg/pyssp_simulate/releases/download/",
              "Requires-Dist: pyssp-vv @ https://github.com/pyssporg/pyssp_vv/releases/download/",
              "Requires-Dist: pyssp-sysml2 @ https://github.com/pyssporg/pyssp_sysml2/releases/download/v0.5.0/",
              "Requires-Dist: pyfmi-sysml2 @ https://github.com/pyssporg/pyfmi_sysml2/releases/download/v0.2.0/",
              "Requires-Dist: sequence-extensions-flow @ https://github.com/pyssporg/sequence_extensions/releases/download/v3.0.0/",
          )
          missing = [line for line in required if line not in text]
          assert not missing, f"{wheel}: missing {missing}"
          print(wheel, "declares its capability dependencies")
          PY

      - name: Check sdist ships package sources only
        run: |
          python - <<'PY'
          import glob, tarfile
          (sdist,) = glob.glob("dist/*.tar.gz")
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
          vendored = [n for n in names if "/3rd_party/" in n]
          assert not vendored, f"{sdist}: vendors {len(vendored)} 3rd_party entries"
          assert any(n.endswith("/pyproject.toml") for n in names), f"{sdist}: missing pyproject.toml"
          print(sdist, "ships sources only")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
