name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            extras: "dev"
          - python: "3.11"
            extras: "dev,flow"
          - python: "3.12"
            extras: "dev,flow"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"

      - name: Tests
        run: python -m pytest

      - name: Core imports nothing third-party
        run: |
          python - <<'PY'
          import sys
          import pyssp_vv
          import pyssp_vv.spec.assessment
          import pyssp_vv.evidence.bundle
          heavy = {"numpy", "pandas", "matplotlib", "sequence_extensions"} & set(sys.modules)
          assert not heavy, f"core imported {sorted(heavy)}"
          PY
