name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest

      - name: No capability creep
        run: |
          python - <<'PY'
          import pathlib
          forbidden = ("passed(", "def compare(", "def judge(")
          hits = []
          for path in pathlib.Path("src").rglob("*.py"):
              text = path.read_text()
              for needle in forbidden:
                  if needle in text:
                      hits.append(f"{path}: {needle}")
          assert not hits, "capability leaked into the workflow layer:\n" + "\n".join(hits)
          PY
