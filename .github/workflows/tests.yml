name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Pin the OMSimulator sdist whose nightly is still published: newer
          # sdists (post198) fetch a linux-focal URL that 404s on the current
          # runner image. post115 is pyssp_simulate's declared minimum anyway.
          python -m pip install "OMSimulator==3.0.0.post115" -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: python -m pytest -m "not slow"

      - name: No capability creep
        run: |
          python - <<'PY'
          import pathlib
          forbidden = ("passed(", "def compare(", "def judge(")
          hits = []
          for path in pathlib.Path("src").rglob("*.py"):
              text = path.read_text()
              for needle in forbidden:
                  if needle in text:
                      hits.append(f"{path}: {needle}")
          assert not hits, "capability leaked into the workflow layer:\n" + "\n".join(hits)
          PY

      - name: Tests leave the checkout clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"
